services:
  jenkins:
    build: .
    container_name: jenkins
    user: root            # simple way to use the host docker socket (TP only)
    ports:
      - "8080:8080"
    env_file: .env        # DOCKERHUB_USER, DOCKERHUB_TOKEN, JENKINS_ADMIN_PASSWORD
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/repo:ro      # the local git repository watched by the pipeline

volumes:
  jenkins_home:
